spring.application.name=dashboard

spring.datasource.url=jdbc:mysql://localhost:3306/dashboard
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
# Desactivado para evitar salida SQL excesiva en ejecución normal
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

aruba.client.id=${ARUBA_CLIENT_ID}
aruba.client.secret=${ARUBA_CLIENT_SECRET}
aruba.base.url=https://apigw-eucentral3.central.arubanetworks.com
aruba.sync.initial-delay-ms=3600000
aruba.sync.fixed-rate-ms=3600000
metrics.sync.initial-delay-ms=3600000
metrics.sync.fixed-rate-ms=3600000

# Umbrales y pesos de KPIs. Se mantienen los valores funcionales actuales,
# pero centralizados para evitar numeros magicos repartidos por servicios.
kpi.status.yellow-min=34
kpi.status.red-min=67
kpi.status.max=100
kpi.affection.green=0
kpi.affection.yellow=50
kpi.affection.red=100
kpi.freshness.aruba-minutes=70
kpi.freshness.citrix-minutes=70
kpi.freshness.microsoft365-minutes=70
kpi.freshness.glpi-minutes=70

kpi.weights.global-status.aruba=0.40
